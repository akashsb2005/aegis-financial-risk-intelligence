name: PostgreSQL validation

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

jobs:
  validate-postgresql:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: aegis_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d aegis_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGDATABASE: aegis_test
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          psql --version

      - name: Apply schema dump
        shell: bash
        run: |
          # The dump was generated by pg_dump 18. Remove only psql client
          # guard commands so it can be consumed by the runner's psql client.
          sed '/^\\restrict /d; /^\\unrestrict /d' database/ddl/01_schema.sql > /tmp/aegis_schema.sql
          psql -v ON_ERROR_STOP=1 -f /tmp/aegis_schema.sql

      - name: Load deterministic synthetic demo data
        run: psql -v ON_ERROR_STOP=1 -f database/seeds/01_demo_data.sql

      - name: Apply market and evidence data model
        run: psql -v ON_ERROR_STOP=1 -f database/ddl/02_market_evidence.sql

      - name: Load public security master identifiers
        run: psql -v ON_ERROR_STOP=1 -f database/seeds/02_public_securities.sql

      - name: Validate market and evidence schema
        run: psql -v ON_ERROR_STOP=1 -f database/verification/06_market_evidence_assertions.sql

      - name: Check market ingestion script syntax
        run: python -m py_compile data_pipeline/ingest_market_data.py

      - name: Execute analytical query portfolio
        run: |
          psql -v ON_ERROR_STOP=1 -f database/queries/01_basic_queries.sql
          psql -v ON_ERROR_STOP=1 -f database/queries/02_joins_and_aggregations.sql
          psql -v ON_ERROR_STOP=1 -f database/queries/03_subqueries_ctes_window_functions.sql

      - name: Execute read-only schema verification
        run: psql -v ON_ERROR_STOP=1 -f database/verification/01_schema_verification.sql

      - name: Execute behavioral database integration tests
        run: psql -v ON_ERROR_STOP=1 -f database/verification/02_behavioral_integration_tests.sql

      - name: Execute transaction demonstrations
        run: psql -v ON_ERROR_STOP=1 -f database/verification/03_transaction_demo.sql

      - name: Execute final database structure assertions
        run: psql -v ON_ERROR_STOP=1 -f database/verification/04_final_structure_assertions.sql

      - name: Execute two-session concurrency and isolation demonstration
        run: bash database/verification/05_concurrency_demo.sh

      - name: Install Python API test dependencies
        run: python -m pip install -r backend/requirements.txt -r backend/requirements-dev.txt

      - name: Run FastAPI application tests
        run: |
          export AEGIS_TEST_DATABASE_URL="postgresql+psycopg://${PGUSER}:${PGPASSWORD}@${PGHOST}:${PGPORT}/${PGDATABASE}"
          pytest -q backend/tests
